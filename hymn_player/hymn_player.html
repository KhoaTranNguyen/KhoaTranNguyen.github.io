<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Music Player</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
  /* 🎵 General layout & font */
  body {
    font-family: 'Inter', sans-serif;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  /* 🌗 Light/Dark mode base colors */
  body.light {
    background: linear-gradient(135deg, #f9fafb, #e5e7eb);
    color: #1f2937;
  }

  body.dark {
    background: linear-gradient(135deg, #111827, #1f2937);
    color: #f9fafb;
  }

  /* 🌟 Album section */
  .album-cover {
    position: relative;
    width: 16rem;
    height: 16rem;
    background-color: #1f2937;
    border-radius: 1rem;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .album-cover:hover {
    transform: scale(1.05);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
  }

  .album-cover img {
    width: 50%;
    height: 50%;
    object-fit: cover;
    filter: brightness(0.95);
    transition: filter 0.3s ease;
  }

  .album-cover:hover img {
    filter: brightness(1);
  }

  /* 🟢 Play button overlay */
  .album-cover .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: right;
    justify-content: right;
    background: rgba(0, 0, 0, 0.3);
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .album-cover:hover .overlay {
    opacity: 1;
  }

  .album-cover .overlay svg {
    width: 3rem;
    height: 3rem;
    color: white;
    filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.4));
    transition: transform 0.2s ease;
  }

  .album-cover .overlay svg:hover {
    transform: scale(1.15);
  }

  /* 💿 Playlist area */
  #playlist {
    max-height: 420px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: #9ca3af transparent;
  }

  #playlist::-webkit-scrollbar {
    width: 8px;
  }

  #playlist::-webkit-scrollbar-thumb {
    background-color: #9ca3af;
    border-radius: 4px;
  }

  #playlist li {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid rgba(229, 231, 235, 0.2);
    transition: background-color 0.2s ease-in-out, color 0.2s ease;
    cursor: pointer;
  }

  body.light #playlist li:hover {
    background-color: #f9fafb;
  }

  body.dark #playlist li:hover {
    background-color: rgba(55, 65, 81, 0.5);
  }

  #playlist li.active {
    background-color: #3b82f6;
    color: white;
  }

  /* 🎚️ Buttons */
  button {
    transition: background-color 0.2s ease, transform 0.15s ease;
  }

  button:hover {
    transform: translateY(-1px);
  }

  button:active {
    transform: translateY(1px);
  }

  /* 🎛️ Audio control */
  audio {
    accent-color: #3b82f6;
    background: transparent;
  }

  /* 🌈 Theme toggle (optional button) */
  .theme-toggle {
    position: fixed;
    top: 1rem;
    right: 1rem;
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.3);
    backdrop-filter: blur(6px);
    color: white;
    border-radius: 9999px;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }

  .theme-toggle:hover {
    background: rgba(255,255,255,0.35);
  }
  </style>
</head>
<body class="dark text-gray-100 antialiased transition-colors duration-300 bg-black">

  <button 
    class="theme-toggle fixed top-4 right-4 p-3 rounded-full border border-gray-600 
           transition-all duration-300 bg-white text-black dark:bg-black dark:text-white"
    onclick="document.body.classList.toggle('dark'); document.body.classList.toggle('light');"
    aria-label="Toggle theme">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="currentColor" viewBox="0 0 20 20">
      <path d="M10 2a8 8 0 000 16 8 8 0 010-16zM10 4a6 6 0 100 12A6 6 0 0010 4z"/>
    </svg>
  </button>

  <main class="w-full max-w-7xl mx-auto mt-12 flex flex-col md:flex-row gap-8 px-4">

    <div class="md:w-1/2 lg:w-2/5">
      <div class="relative w-64 h-64 bg-gray-200 flex items-center justify-center overflow-hidden rounded-lg shadow-lg mx-auto">
        <img
          src="hymn_player/music/various-spirit-song-disc-c-2013/cover.jpg"
          alt="Album Cover"
          class="w-full h-full object-cover">
        <!-- translucent overlay with play icon (doesn't replace cover) -->
        <button class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-20 hover:bg-opacity-30"
                aria-label="Play album">
          <svg class="h-12 w-12 text-white opacity-90 pointer-events-none" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"/>
          </svg>
        </button>
      </div>

      
      <h2 class="text-xl font-bold uppercase mt-6 tracking-wide text-gray-700">MY ALBUM PLAYLIST</h2>
      
      <div class="mt-4 text-gray-600 space-y-2">
        <p>A collection of beautiful tracks.</p>
        <p class="text-sm">Click a song to play.</p>
      </div>

      <div class="mt-6 flex justify-between items-center space-x-4">
        <button id="prev" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-4 py-2 rounded-full text-sm">⏮ Prev</button>
        <audio id="audio" controls class="flex-auto max-w-[calc(100%-8rem)] rounded-full"></audio>
        <button id="next" class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-4 py-2 rounded-full text-sm">Next ⏭</button>
      </div>

    </div>

    <div class="md:w-1/2 lg:w-3/5 bg-white border border-gray-200 rounded-md overflow-hidden shadow-sm">
      <h3 class="sr-only">Playlist</h3> <div id="player-container">
        <p id="song-title" class="px-6 py-4 text-gray-700 font-semibold text-lg border-b border-gray-200">No song playing</p>
        <ul id="playlist">
          </ul>
      </div>
    </div>

  </main>

  <script src="hymn_script.js"></script>
</body>
</html>
